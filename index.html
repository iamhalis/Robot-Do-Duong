<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Chọn Quy Tắc Mô Phỏng</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            /* Con trỏ bự */
            cursor: url('cursor.png') 0 0, auto;
        }

        h1 {
            color: #2c3e50;
            font-size: 36px;
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        }

        .menu-container {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .option-box {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 320px;
            height: 320px;
            background-color: rgba(27, 105, 137, 0.85);
            color: white;
            font-size: 32px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 45px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
            text-align: center;
            backdrop-filter: blur(5px);
            /* Con trỏ bự khi chỉ vào nút */
            cursor: url('cursor.png') 0 0, pointer;
        }

        .option-box:hover {
            transform: translateY(-10px) scale(1.02);
            background-color: rgba(27, 105, 137, 1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
        }
    </style>
</head>
<body>

    <h1>CHỌN QUY TẮC MÔ PHỎNG</h1>
    
    <div class="menu-container">
        <a href="quy-tac-tay-trai.html" class="option-box">QUY TẮC<br>TAY TRÁI</a>
        <a href="quy-tac-tay-phai.html" class="option-box">QUY TẮC<br>TAY PHẢI</a>
    </div>

</body>
</html>
